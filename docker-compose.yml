services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      - WORK_DIR=/data
    volumes:
      - tde_work:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  bot:
    build: ./bot
    env_file: .env
    restart: unless-stopped
    depends_on:
      - backend

  frontend:
    build: ./frontend
    environment:
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  tde_work:
